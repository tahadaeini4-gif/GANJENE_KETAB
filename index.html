<script>
const API_URL="https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTKMNtLPAP36wVXXaYSUkp8qFSU8_fiwmDsPukkLdbW6ChYTMpFICRvSZm27BFN2idkLDuJJwc3zlB2xOMCE3z7LWFE1sZGqSdTGpXdyCDd3Qxow5vsZmSzWUe5ibniVBkRt1eI29MqxIPM6ylK0zBKNfTO4sLkzlOKGH5y0jaxNH476aYc4bCTE5i7kto5OdbeSsSbmOdizhXjIn3iSicrahA2tU7u7QGZdUeRRiGeBJxhdpeowy_EEzcIPELtrNzJ76eDescqDm2YvdZtO18xznuXAA&lib=MtOr2LjdMcx-9vO2n6kIUnqGpNDEPRDbC";

const GRADES=["هفتم","هشتم","نهم"];

const DEFAULT_SUBJECTS=[
"علمی","زندگی‌نامه","کمک درسی","داستان و رمان","شعر و ادبیات",
"تاریخ","جغرافیا","دینی و اخلاقی","هنر","ورزش",
"کامپیوتر و فناوری","مهارت‌های زندگی","طنز و سرگرمی","مرجع و دایرةالمعارف"
];

const SUBJECT_ICONS={
"علمی":"bi bi-beaker",
"زندگی‌نامه":"bi bi-person-vcard",
"کمک درسی":"bi bi-pencil-square",
"داستان و رمان":"bi bi-book",
"شعر و ادبیات":"bi bi-feather",
"تاریخ":"bi bi-bank",
"جغرافیا":"bi bi-globe2",
"دینی و اخلاقی":"bi bi-moon-stars",
"هنر":"bi bi-palette",
"ورزش":"bi bi-trophy",
"کامپیوتر و فناوری":"bi bi-pc-display",
"مهارت‌های زندگی":"bi bi-compass",
"طنز و سرگرمی":"bi bi-emoji-smile",
"مرجع و دایرةالمعارف":"bi bi-journals"
};

const QUOTES=[
"کتاب خوب، دوستی است که هرگز تو را ترک نمی‌کند.",
"هر صفحه‌ای که می‌خوانی، پنجره‌ای تازه به دنیاست.",
"خواندن، ورزش مغز است.",
"هر کتاب، ماجرایی تازه برای ذهن توست.",
"کتاب، کلید گنجینه‌ی دانایی است."
];

const DAY=86400000;

function createDefaultState(){
return{
cats:DEFAULT_SUBJECTS.map((name,index)=>({id:`c${index}`,name})),
students:[],
books:[],
res:[],
over:{},
recs:[],
directRecs:[],
scoreHistory:[],
model:[],
top:null,
days:7,
pw:"admin123",
level2Threshold:10
};
}

let S=createDefaultState();
let U=null;
let V={v:"login"};
let HISTORY=[];
let ROLE="";
let SEARCH="";
let CLOUD_READY=false;
let CLOUD_SAVING=false;
let CLOUD_LOADING=false;

const $=selector=>document.querySelector(selector);

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[char]));
}

function createId(prefix="id"){
return`${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,9)}`;
}

function generateStudentCode(){
return"ST"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,7).toUpperCase();
}

function dateFa(value){
if(!value)return"-";
try{return new Date(value).toLocaleDateString("fa-IR")}
catch{return"-"}
}

function hashString(value){
let hash=7;
for(const char of String(value))hash=(hash*31+char.charCodeAt(0))>>>0;
return hash;
}

function findStudent(code){
return(S.students||[]).find(s=>String(s.code)===String(code));
}

function findBook(ip){
return(S.books||[]).find(b=>String(b.ip)===String(ip));
}

function bookName(book){
if(!book)return"";
return S.over?.[book.ip]?.name||book.name||"";
}

function activeReservation(ip){
return(S.res||[]).find(r=>String(r.book)===String(ip)&&!r.done);
}

function reservationExpired(r){
return Date.now()>=Number(r.due||0);
}

function gradeFrom(value){
const text=String(value??"").trim();
return GRADES.find(g=>text.includes(g))||text;
}

function normalizeHeader(value){
return String(value??"").replace(/\u200c/g," ").replace(/\s+/g," ").trim();
}

function normalizeState(data){
const base=createDefaultState();
const state=data&&typeof data==="object"?data:base;

if(!Array.isArray(state.cats)||!state.cats.length)state.cats=base.cats;
if(!Array.isArray(state.students))state.students=[];
if(!Array.isArray(state.books))state.books=[];
if(!Array.isArray(state.res))state.res=[];
if(!state.over||typeof state.over!=="object")state.over={};
if(!Array.isArray(state.recs))state.recs=[];
if(!Array.isArray(state.directRecs))state.directRecs=[];
if(!Array.isArray(state.scoreHistory))state.scoreHistory=[];
if(!Array.isArray(state.model))state.model=[];
if(!Number(state.days))state.days=7;
if(!state.pw)state.pw="admin123";
if(!Number(state.level2Threshold))state.level2Threshold=10;

const usedCodes=new Set();

state.students.forEach(student=>{
let code=String(student.code||"").trim();

if(!code||usedCodes.has(code)){
code=generateStudentCode();
while(usedCodes.has(code))code=generateStudentCode();
}

usedCodes.add(code);

student.code=code;
student.password=String(student.password||"");
student.name=String(student.name||"");
student.grade=String(student.grade||"");
student.pts=Number(student.pts)||0;
});

state.res.forEach(r=>{
r.id=String(r.id||createId("reservation"));
r.book=String(r.book||"");
r.student=String(r.student||"");
r.rating=Number(r.rating)||0;
r.done=!!r.done;
r.read=!!(r.read||r.done);
r.readAt=r.readAt||null;
r.readAwarded=!!r.readAwarded;
r.ratingAwarded=!!r.ratingAwarded;
r.presentation=!!r.presentation;
r.presentationAt=r.presentationAt||null;
r.presentationAwarded=!!r.presentationAwarded;
});

state.directRecs.forEach(rec=>{
rec.id=String(rec.id||createId("direct-rec"));
rec.book=String(rec.book||"");
rec.fromCode=String(rec.fromCode||"");
rec.toCode=String(rec.toCode||"");
rec.awarded=!!rec.awarded;
});

return state;
}

async function loadState(){
try{
const response=await fetch(API_URL+"?t="+Date.now(),{
method:"GET",
cache:"no-store"
});

if(!response.ok)throw new Error("GET "+response.status);

const result=await response.json();

if(!result||!result.state)throw new Error("state not found");

CLOUD_READY=true;
return normalizeState(result.state);
}catch(error){
CLOUD_READY=false;
console.error(error);
return normalizeState(createDefaultState());
}
}

async function saveState(){
if(CLOUD_SAVING)return false;

try{
CLOUD_SAVING=true;

const payload=JSON.stringify(normalizeState(S));

const response=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:payload
});

if(!response.ok)throw new Error("POST "+response.status);

const result=await response.json();

if(result&&result.ok===false){
throw new Error(result.error||"save failed");
}

CLOUD_READY=true;
return true;
}catch(error){
CLOUD_READY=false;
console.error(error);
return false;
}finally{
CLOUD_SAVING=false;
}
}

async function initializeApp(){
S=normalizeState(createDefaultState());
render();

try{
CLOUD_LOADING=true;
const cloudState=await loadState();

if(cloudState)S=normalizeState(cloudState);

CLOUD_LOADING=false;
render();
}catch(error){
CLOUD_LOADING=false;
render();
}
}

const SCORE_TYPES={
read:{title:"خواندن کتاب",amount:1,icon:"bi-book"},
rate:{title:"امتیاز دادن به کتاب",amount:.5,icon:"bi-star-fill"},
presentation:{title:"ارائه کتاب",amount:2,icon:"bi-mic"},
recommendation:{title:"معرفی کتاب و خوانده‌شدن توسط دوست",amount:3,icon:"bi-people"},
recommendedRead:{title:"خواندن کتاب معرفی‌شده",amount:2,icon:"bi-bookmark-check"}
};

function addScore(studentCode,type,extra={}){
const student=findStudent(studentCode);
const config=SCORE_TYPES[type];

if(!student||!config)return false;

const uniqueKey=extra.uniqueKey||null;

if(uniqueKey&&S.scoreHistory.some(x=>String(x.uniqueKey)===String(uniqueKey))){
return false;
}

const event={
id:createId("score"),
student:String(studentCode),
type,
amount:Number(config.amount),
book:extra.book?String(extra.book):"",
relatedStudent:extra.relatedStudent?String(extra.relatedStudent):"",
uniqueKey,
createdAt:Date.now(),
note:extra.note||""
};

S.scoreHistory.push(event);
student.pts=Number(student.pts||0)+Number(config.amount);

return true;
}

function studentScore(studentCode){
return Number(findStudent(studentCode)?.pts||0);
}

function scoreBreakdown(studentCode){
const result={read:0,rate:0,presentation:0,recommendation:0,recommendedRead:0};

(S.scoreHistory||[])
.filter(x=>String(x.student)===String(studentCode))
.forEach(x=>{
if(result[x.type]!==undefined)result[x.type]+=Number(x.amount||0);
});

return result;
}

function studentLevel(studentCode){
return studentScore(studentCode)>=Number(S.level2Threshold||10)?2:1;
}

function levelProgress(studentCode){
const score=studentScore(studentCode);
const threshold=Number(S.level2Threshold||10);
return score>=threshold?100:Math.min(100,(score/threshold)*100);
}

function formatScore(value){
const n=Number(value||0);
return Number.isInteger(n)
?n.toLocaleString("fa-IR")
:n.toLocaleString("fa-IR",{maximumFractionDigits:1});
}

function scoreLabel(type){
return SCORE_TYPES[type]?.title||"فعالیت";
}

function navigate(view,params={}){
HISTORY.push(V);
V={v:view,...params};
render();
window.scrollTo(0,0);
}

function navigateRoot(view="home"){
HISTORY=[];
V={v:view};
SEARCH="";
render();
window.scrollTo(0,0);
}

function goBack(){
V=HISTORY.pop()||{v:"home"};
render();
}

function categoryById(id){
return(S.cats||[]).find(c=>c.id===id)||null;
}

function booksByCategory(id){
const category=categoryById(id);
if(!category)return[];
return S.books.filter(book=>String(book.subject)===String(category.name));
}

function ensureCategory(subject){
const clean=normalizeHeader(subject);
if(!clean)return;

if(!S.cats.some(c=>normalizeHeader(c.name)===clean)){
S.cats.push({id:createId("cat"),name:clean});
}
}

function renameCategory(id){
const category=categoryById(id);
if(!category)return;

const name=prompt("نام جدید دسته‌بندی:",category.name);
if(!name?.trim())return;

const old=category.name;
category.name=name.trim();

S.books.forEach(book=>{
if(book.subject===old)book.subject=category.name;
});

saveState();
render();
}

function deleteCategory(id){
const category=categoryById(id);
if(!category)return;

if(!confirm(`دسته «${category.name}» حذف شود؟ کتاب‌ها حذف نمی‌شوند.`))return;

S.cats=S.cats.filter(c=>c.id!==id);
saveState();
render();
}

function addCategory(){
const name=prompt("نام دسته‌بندی جدید:");
if(!name?.trim())return;
ensureCategory(name);
saveState();
render();
}

function createCover(title,hue,variation){
const safeTitle=String(title).slice(0,42);

const svg=`
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">
<rect width="300" height="400" fill="hsl(${hue},60%,45%)"/>

function readExcel(file,callback){
if(!file){
alert("ابتدا فایل Excel را انتخاب کنید.");
return;
}

if(typeof XLSX==="undefined"){
alert("کتابخانه Excel بارگذاری نشده است.");
return;
}

const reader=new FileReader();

reader.onload=e=>{
try{
const workbook=XLSX.read(e.target.result,{type:"array"});
const allRows=[];

workbook.SheetNames.forEach(sheet=>{
const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheet],{
header:1,
defval:"",
raw:false
});

rows.forEach(row=>{
if(row.some(cell=>String(cell).trim()!==""))allRows.push(row);
});
});

callback(allRows);
}catch(error){
console.error(error);
alert("فایل Excel خوانده نشد.");
}
};

reader.readAsArrayBuffer(file);
}

function findColumnIndexes(rows){
const aliases={
name:["نام کتاب","عنوان کتاب","نام"],
subject:["موضوع","دسته بندی","دسته‌بندی","دسته"],
author:["نام نویسنده","نویسنده","مولف","مؤلف"],
date:["تاریخ انتشار","تاریخ"],
grade:["پایه تحصیلی","پایه","مقطع"],
ip:["ip","شماره کتاب","شماره"]
};

let headerIndex=-1;

for(let i=0;i<Math.min(rows.length,15);i++){
const normalized=rows[i].map(normalizeHeader);

if(
normalized.some(x=>aliases.name.includes(x))&&
normalized.some(x=>aliases.subject.includes(x))
){
headerIndex=i;
break;
}
}

if(headerIndex===-1)return null;

const header=rows[headerIndex].map(normalizeHeader);
const indexes={};

Object.entries(aliases).forEach(([key,names])=>{
indexes[key]=header.findIndex(cell=>names.includes(cell));
});

return{headerIndex,indexes};
}

function importBooks(addToExisting=false){
const input=$("#booksExcel");
const file=input?.files?.[0];

if(!file){
alert("فایل Excel را انتخاب کنید.");
return;
}

readExcel(file,rows=>{
const structure=findColumnIndexes(rows);

if(!structure){
alert("ساختار فایل شناسایی نشد.");
return;
}

const{headerIndex,indexes}=structure;

const existingIps=new Set(
addToExisting?S.books.map(b=>String(b.ip)):[]
);

let nextIp=Math.max(0,...S.books.map(b=>Number(b.ip)||0));
const imported=[];

for(let i=headerIndex+1;i<rows.length;i++){
const row=rows[i];

const name=String(row[indexes.name]??"").trim();
if(!name)continue;

const subject=indexes.subject>=0?String(row[indexes.subject]??"").trim():"";
const author=indexes.author>=0?String(row[indexes.author]??"").trim():"";
const date=indexes.date>=0?String(row[indexes.date]??"").trim():"";
const grade=indexes.grade>=0?gradeFrom(row[indexes.grade]):"";

let ip=indexes.ip>=0?String(row[indexes.ip]??"").trim():"";

if(!ip||existingIps.has(ip)){
do{
nextIp++;
ip=String(nextIp);
}while(existingIps.has(ip));
}

existingIps.add(ip);
ensureCategory(subject);

imported.push({ip,name,subject,author,date,grade});
}

if(!imported.length){
alert("هیچ کتابی پیدا نشد.");
return;
}

S.books=addToExisting?[...S.books,...imported]:imported;

saveState();
alert(`${imported.length} کتاب ثبت شد.`);
input.value="";
render();
});
}

function finishReservation(id){

function markReservationRead(id){
if(U?.role!=="admin"){
alert("ثبت مطالعه فقط توسط مدیر انجام می‌شود.");
return;
}

const reservation=(S.res||[]).find(r=>String(r.id)===String(id));

if(!reservation){
alert("رزرو پیدا نشد.");
return;
}

if(reservation.read){
alert("این کتاب قبلاً به‌عنوان خوانده‌شده ثبت شده است.");
return;
}

const student=findStudent(reservation.student);

if(!student){
alert("دانش‌آموز این رزرو پیدا نشد.");
return;
}

reservation.read=true;
reservation.done=true;
reservation.readAt=Date.now();

if(!reservation.readAwarded){
const added=addScore(reservation.student,"read",{
book:reservation.book,
uniqueKey:`read-admin-${reservation.id}`
});

reservation.readAwarded=added||reservation.readAwarded;
}

saveState();

alert(`مطالعه کتاب برای «${student.name}» ثبت شد و ۱ امتیاز اضافه شد.`);

render();
}

function togglePresentation(id){
if(U?.role!=="admin"){
alert("ثبت ارائه کتاب فقط توسط مدیر انجام می‌شود.");
return;
}

const reservation=(S.res||[]).find(r=>String(r.id)===String(id));

if(!reservation){
alert("رزرو پیدا نشد.");
return;
}

const student=findStudent(reservation.student);
const book=findBook(reservation.book);

if(!reservation.presentation){

reservation.presentation=true;
reservation.presentationAt=Date.now();

if(!reservation.presentationAwarded){
const added=addScore(reservation.student,"presentation",{
book:reservation.book,
uniqueKey:`presentation-admin-${reservation.id}`
});

reservation.presentationAwarded=added||reservation.presentationAwarded;
}

saveState();

alert(`ارائه کتاب برای «${student?.name||"دانش‌آموز"}» ثبت شد.`);

}else{

reservation.presentation=false;
reservation.presentationAt=null;

if(reservation.presentationAwarded){
const scoreIndex=S.scoreHistory.findIndex(x=>
String(x.uniqueKey)===`presentation-admin-${reservation.id}`
);

if(scoreIndex>=0){
const score=S.scoreHistory[scoreIndex];
const target=findStudent(reservation.student);

if(target){
target.pts=Math.max(0,Number(target.pts||0)-Number(score.amount||0));
}

S.scoreHistory.splice(scoreIndex,1);
}

reservation.presentationAwarded=false;
}

saveState();

alert("ثبت ارائه کتاب لغو شد.");
}

render();
}

function rateBook(id,rating){

});

reservation.ratingAwarded=added||reservation.ratingAwarded;

saveState();
render();

function recommendBook(ip){
const select=$(`#recommendStudent_${CSS.escape(String(ip))}`);

if(!select||!select.value){
alert("دانش‌آموز مورد نظر را انتخاب کنید.");
return;
}

const target=String(select.value);

if(target===String(U.code)){
alert("نمی‌توانید کتاب را به خودتان معرفی کنید.");
return;
}

const duplicate=(S.directRecs||[]).some(r=>
String(r.book)===String(ip)&&
String(r.fromCode)===String(U.code)&&
String(r.toCode)===target
);

if(duplicate){
alert("این کتاب قبلاً به این دانش‌آموز معرفی شده است.");
return;
}

S.directRecs.push({
id:createId("direct-rec"),
book:String(ip),
fromCode:String(U.code),
toCode:target,
createdAt:Date.now(),
awarded:false
});

saveState();
alert("کتاب با موفقیت معرفی شد.");
render();
}

function deleteReservation(id){
if(!confirm("این رزرو حذف شود؟"))return;

const reservation=S.res.find(r=>String(r.id)===String(id));

if(reservation){

const scoreKeys=[
`read-admin-${reservation.id}`,
`presentation-admin-${reservation.id}`,
`rating-${reservation.id}`
];

scoreKeys.forEach(key=>{
const index=S.scoreHistory.findIndex(x=>String(x.uniqueKey)===key);

if(index>=0){
const score=S.scoreHistory[index];
const student=findStudent(score.student);

if(student){
student.pts=Math.max(0,Number(student.pts||0)-Number(score.amount||0));
}

S.scoreHistory.splice(index,1);
}
});

}

S.res=S.res.filter(r=>String(r.id)!==String(id));

saveState();
render();
}

function addStudent(){
const name=prompt("نام و نام خانوادگی:");

if(!name?.trim())return;

const grade=prompt("پایه تحصیلی:","هفتم")||"";

let password=prompt("رمز عبور دانش‌آموز:");

if(password===null)return;

password=password.trim();

if(!password){
alert("رمز عبور نمی‌تواند خالی باشد.");
return;
}

if(S.students.some(s=>String(s.password)===password)){
alert("این رمز قبلاً برای دانش‌آموز دیگری ثبت شده است. رمز دیگری انتخاب کنید.");
return;
}

const code=generateStudentCode();

S.students.push({
code,
name:name.trim(),
grade:grade.trim(),
password,
pts:0
});

saveState();

alert(`دانش‌آموز «${name.trim()}» ثبت شد.`);

render();
}

function editStudent(code){
const student=findStudent(code);

if(!student)return;

const name=prompt("نام:",student.name);

if(name===null)return;

const grade=prompt("پایه:",student.grade||"");

if(grade===null)return;

const password=prompt("رمز عبور:",student.password||"");

if(password===null)return;

const cleanPassword=password.trim();

if(!cleanPassword){
alert("رمز عبور نمی‌تواند خالی باشد.");
return;
}

const duplicate=S.students.some(s=>
String(s.code)!==String(code)&&
String(s.password)===cleanPassword
);

if(duplicate){
alert("این رمز قبلاً برای دانش‌آموز دیگری ثبت شده است.");
return;
}

student.name=name.trim();
student.grade=grade.trim();
student.password=cleanPassword;

saveState();
render();
}

function deleteStudent(code){
if(!confirm("این دانش‌آموز حذف شود؟"))return;

S.students=S.students.filter(s=>String(s.code)!==String(code));

S.res=S.res.filter(r=>String(r.student)!==String(code));

S.directRecs=S.directRecs.filter(r=>
String(r.fromCode)!==String(code)&&
String(r.toCode)!==String(code)
);

S.scoreHistory=S.scoreHistory.filter(x=>String(x.student)!==String(code));

saveState();
render();
}

S.over[ip]={

name,
img:e.target.result
};

saveState();

render();
};

reader.readAsDataURL(file);

return;
}

S.over[ip]={
...(S.over[ip]||{}),
name
};

saveState();

alert("اطلاعات کتاب ذخیره شد.");

render();
}

const SUBJECT_ICONS = {

    "کمک درسی": "bi bi-pencil-square",

const QUOTES = [

    "کتاب، کلید گنجینه‌ی دانایی است."
];

const DAY = 86400000;

function createDefaultState() {
    return {
        cats: DEFAULT_SUBJECTS.map((name, index) => ({
            id: `c${index}`,
            name
        })),
        students: [],
        books: [],
        res: [],

    };

let CLOUD_READY = false;
let CLOUD_SAVING = false;

let S = createDefaultState();
let U = null;
let V = { v: "login" };
let HISTORY = [];
let ROLE = "";

function normalizeState(data) {
    const base = createDefaultState();
    const state = (data && typeof data === "object") ? data : base;

    if (!Array.isArray(state.cats)) state.cats = base.cats;
    if (!Array.isArray(state.students)) state.students = [];
    if (!Array.isArray(state.books)) state.books = [];
    if (!Array.isArray(state.res)) state.res = [];
    if (!state.over || typeof state.over !== "object") state.over = {};
    if (!Array.isArray(state.recs)) state.recs = [];
    if (!Array.isArray(state.model)) state.model = [];
    if (!Number(state.days)) state.days = 7;
    if (!state.pw) state.pw = "admin123";

    state.students.forEach(student => {
        if (!student.password) student.password = String(student.code || "");
    });

    return state;
}

async function loadState() {
    if (!API_URL || API_URL.includes("PASTE_YOUR_")) {
        CLOUD_READY = false;
        return normalizeState(createDefaultState());
    }

    try {
        const response = await fetch(API_URL + "?t=" + Date.now(), {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) throw new Error("خطا در ارتباط با سرور");

        const result = await response.json();
        CLOUD_READY = true;
        return normalizeState(result.state || createDefaultState());
    } catch (error) {
        CLOUD_READY = false;
        console.error("Cloud load error:", error);
        return normalizeState(createDefaultState());
    }
}

async function saveState() {
    if (!API_URL || API_URL.includes("PASTE_YOUR_")) {
        alert("ابتدا آدرس Google Apps Script را در API_URL قرار دهید.");

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(normalizeState(S))
        });

        if (!response.ok) throw new Error("خطا در ذخیره اطلاعات");

        const result = await response.json();
        if (!result.ok) throw new Error(result.error || "خطا در ذخیره اطلاعات");

        CLOUD_READY = true;
        return true;
    } catch (error) {
        CLOUD_READY = false;
        console.error("Cloud save error:", error);
        console.error("ذخیره اطلاعات انجام نشد:", error);
        return false;
    } finally {
        CLOUD_SAVING = false;
    }
}

async function initializeApp() {
    S = normalizeState(createDefaultState());
    render();

    if (!API_URL || API_URL.includes("PASTE_YOUR_")) return;

    setTimeout(async () => {
        try {
            const cloudState = await loadState();

const $ = selector => document.querySelector(selector);

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[char]));
}

function dateFa(value) {
    if (!value) return "-";
    return new Date(value).toLocaleDateString("fa-IR");
}

function hashString(value) {
    let hash = 7;
    for (const char of String(value)) {
        hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
    }
    return hash;
}

function findStudent(code) {
    return S.students.find(student => student.code == code);
}

function findBook(ip) {
    return S.books.find(book => String(book.ip) === String(ip));
}

function bookName(book) {
    return S.over[book.ip]?.name || book.name;
}

function activeReservation(ip) {
    return S.res.find(item => String(item.book) === String(ip) && !item.done);
}

function reservationExpired(reservation) {
    return Date.now() >= reservation.due;
}

function gradeFrom(value) {
    const text = String(value ?? "").trim();
    return GRADES.find(grade => text.includes(grade)) || text;
}

function normalizeHeader(value) {
    return String(value ?? "")
        .replace(/\u200c/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function createId(prefix = "id") {
    return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

function navigate(view, params = {}) {
    HISTORY.push(V);
    V = { v: view, ...params };
    render();
    window.scrollTo(0, 0);
}

function navigateRoot(view = "home") {
    HISTORY = [];
    V = { v: view };
    SEARCH = "";
    render();
    window.scrollTo(0, 0);
}

function goBack() {
    V = HISTORY.pop() || { v: "home" };
    render();
}


function categoryById(id) {
    for (const category of S.cats) {
        if (category.id === id) return category;

        for (const sub of category.subs || []) {
            if (sub.id === id) return sub;
        }
    }

    return null;
}

function booksByCategory(id) {
    const category = categoryById(id);
    if (!category) return [];

    if (category.grade) {
        return S.books.filter(book => book.grade === category.grade);
    }

    return S.books.filter(book => book.subject === category.name);
}

function ensureCategory(subject) {
    const cleanSubject = normalizeHeader(subject);
    if (!cleanSubject) return;

    const exists = S.cats.some(
        category => normalizeHeader(category.name) === cleanSubject
    );

    if (!exists) {
        S.cats.push({

}

function renameCategory(id) {
    const category = categoryById(id);
    if (!category) return;

    const oldName = category.name;
    const newName = prompt("نام جدید دسته‌بندی:", oldName);

    if (!newName || !newName.trim()) return;

    category.name = newName.trim();

    if (!category.subs && !category.grade) {
        S.books.forEach(book => {
            if (book.subject === oldName) {
                book.subject = category.name;
            }
        });
    }

    saveState();
    render();
}

function deleteCategory(id) {
    const category = categoryById(id);
    if (!category) return;

    if (!confirm(`دسته «${category.name}» حذف شود؟ کتاب‌ها حذف نخواهند شد.`)) {
        return;
    }

    S.cats = S.cats.filter(item => item.id !== id);
    saveState();
    render();
}

function addCategory() {

function createCover(title, hue, variation) {
    const safeTitle = String(title).slice(0, 42);

    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">
            <rect width="300" height="400" fill="hsl(${hue},60%,45%)"/>
            <rect x="20" y="20" width="260" height="360"
                  fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>
            <circle cx="150" cy="130"
                    r="${50 + variation * 15}"
                    fill="hsl(${hue + 40},70%,70%)"
                    opacity=".8"/>
            <text x="150" y="260" font-size="22"
                  fill="#fff" text-anchor="middle"
                  font-family="Tahoma">
                ${escapeHTML(safeTitle.slice(0, 20))}
            </text>
            <text x="150" y="295" font-size="16"
                  fill="#fff" text-anchor="middle"
                  font-family="Tahoma">
                ${escapeHTML(safeTitle.slice(20))}
            </text>
        </svg>
    `;

    return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

function bookImages(book) {
    const hue = hashString(`${book.ip}${book.name}`) % 360;

    const images = [0, 1, 2].map(
        variation => createCover(bookName(book), hue + variation * 20, variation)
    );

    if (S.over[book.ip]?.img) {
        images[0] = S.over[book.ip].img;
    }

    return images;
}


function readExcel(file, callback) {
    if (!file) {
        alert("ابتدا فایل Excel را انتخاب کنید.");
        return;
    }

    if (typeof XLSX === "undefined") {
        alert("کتابخانه Excel بارگذاری نشده است.");
        return;
    }

    const reader = new FileReader();

    reader.onload = event => {
        try {
            const workbook = XLSX.read(event.target.result, {
                type: "array"
            });

            if (!workbook.SheetNames.length) {
                throw new Error("No sheet");
            }

           
            const allRows = [];

            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];

                const rows = XLSX.utils.sheet_to_json(sheet, {
                    header: 1,
                    defval: "",
                    raw: false
                });

                rows.forEach(row => {
                    if (row.some(cell => String(cell).trim() !== "")) {
                        allRows.push(row);
                    }
                });
            });

            callback(allRows);
        } catch (error) {
            console.error(error);
            alert("فایل Excel خوانده نشد.");
        }
    };

    reader.readAsArrayBuffer(file);
}

function findColumnIndexes(rows) {
    const aliases = {
        name: ["نام کتاب", "عنوان کتاب", "نام"],
        subject: ["موضوع", "دسته بندی", "دسته‌بندی", "دسته"],
        author: ["نام نویسنده", "نویسنده", "مولف", "مؤلف"],
        date: ["تاریخ انتشار", "تاریخ"],
        grade: ["پایه تحصیلی", "پایه", "مقطع"],
        ip: ["ip", "شماره کتاب", "شماره"]
    };

    let headerIndex = -1;

    for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const normalized = rows[i].map(normalizeHeader);

        if (
            normalized.some(cell => aliases.name.includes(cell)) &&
            normalized.some(cell => aliases.subject.includes(cell))
        ) {
            headerIndex = i;
            break;
        }
    }

    if (headerIndex === -1) {
        return null;
    }

    const header = rows[headerIndex].map(normalizeHeader);
    const indexes = {};

    Object.entries(aliases).forEach(([key, possibleNames]) => {
        indexes[key] = header.findIndex(
            cell => possibleNames.includes(cell.toLowerCase())
        );
    });

    return {
        headerIndex,
        indexes
    };
}

function importBooks(addToExisting = false) {
    const input = $("#booksExcel");
    const file = input?.files?.[0];

    if (!file) {
        alert("فایل Excel را انتخاب کنید.");
        return;
    }

    readExcel(file, rows => {
        const structure = findColumnIndexes(rows);

        if (!structure || structure.indexes.name === -1) {
            alert(
                "ساختار فایل شناسایی نشد.\n\n" +
                "حداقل ستون «نام کتاب» باید وجود داشته باشد."
            );
            return;
        }

        const { headerIndex, indexes } = structure;

        const importedBooks = [];
        const existingIps = new Set(
            addToExisting
                ? S.books.map(book => String(book.ip))
                : []
        );

        let nextIp = Math.max(
            0,
            ...S.books.map(book => Number(book.ip) || 0)
        );

        let addedCategories = 0;

        for (let i = headerIndex + 1; i < rows.length; i++) {
            const row = rows[i];

            const name = String(
                row[indexes.name] ?? ""
            ).trim();

            if (!name) continue;

            const subject = indexes.subject >= 0
                ? String(row[indexes.subject] ?? "").trim()
                : "";

            const author = indexes.author >= 0
                ? String(row[indexes.author] ?? "").trim()
                : "";

            const date = indexes.date >= 0
                ? String(row[indexes.date] ?? "").trim()
                : "";

            const grade = indexes.grade >= 0
                ? gradeFrom(row[indexes.grade])
                : "";

            let ip = indexes.ip >= 0
                ? String(row[indexes.ip] ?? "").trim()
                : "";

            if (!ip || existingIps.has(ip)) {
                do {
                    nextIp++;
                    ip = String(nextIp);
                } while (existingIps.has(ip));
            }

            existingIps.add(ip);

            const before = S.cats.length;
            ensureCategory(subject);
            if (S.cats.length > before) {
                addedCategories++;
            }

            importedBooks.push({
                ip,
                name,
                subject,
                author,
                date,
                grade
            });
        }

        if (!importedBooks.length) {
            alert("هیچ کتابی در فایل پیدا نشد.");
            return;
        }

        S.books = addToExisting
            ? [...S.books, ...importedBooks]
            : importedBooks;

        saveState();

        alert(
            `${importedBooks.length} کتاب ثبت شد.` +
            (addedCategories
                ? `\n${addedCategories} دسته‌بندی جدید نیز از Excel ساخته شد.`
                : "")
        );

        input.value = "";
        render();
    });
}

function doLogin() {
    const value = $("#loginInput")?.value.trim();

    if (!value) {
        alert("لطفاً رمز عبور را وارد کنید.");
        return;
    }

    if (ROLE === "admin") {
        if (value !== S.pw) {
            alert("رمز مدیر اشتباه است.");
            return;
        }

        U = { role: "admin" };
    } else {
       
        const student = (S.students || []).find(s => String(s.password || "") === value);

        if (!student) {
            alert("رمز عبور دانش‌آموز اشتباه است.");
            return;
        }

        U = {
            role: "student",
            code: student.code,
            name: student.name,
            quote: QUOTES[Math.floor(Math.random() * QUOTES.length)]
        };
    }

    U.quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    navigateRoot("home");

function editBookName(ip) {
    const value = $("#editBookName")?.value.trim();

    if (!value) return;

    S.over[ip] = S.over[ip] || {};
    S.over[ip].name = value;

    saveState();
    render();
}

function editBookImage(ip) {
    const file = $("#editBookImage")?.files?.[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = event => {
        const image = new Image();

        image.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = 300;
            canvas.height = 400;

            canvas.getContext("2d")
                .drawImage(image, 0, 0, 300, 400);

            S.over[ip] = S.over[ip] || {};
            S.over[ip].img = canvas.toDataURL("image/jpeg", .7);

            saveState();
            render();
        };

        image.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

function resetBookOverride(ip) {
    delete S.over[ip];
    saveState();
    render();
}

function deleteBook(ip) {
    if (!confirm("این کتاب حذف شود؟")) return;

    S.books = S.books.filter(book => String(book.ip) !== String(ip));

function saveBookRecommendation(ip) {
    if (U.role !== "student") return;

    const book = findBook(ip);
    const text = $("#bookRecommendationText")?.value.trim();

    if (!book) {
        alert("کتاب پیدا نشد.");
        return;
    }

    if (!text) {
        alert("لطفاً متن معرفی کتاب را بنویسید.");
        return;
    }

    if (!Array.isArray(S.recs)) S.recs = [];

    const existing = S.recs.find(item =>
        String(item.book) === String(ip) &&
        String(item.fromCode) === String(U.code)
    );

    const student = findStudent(U.code);

    if (existing) {
        existing.text = text;
        existing.fromName = student?.name || U.name || "دانش‌آموز";
        existing.updatedAt = Date.now();
    } else {
        S.recs.push({
            id: createId("rec"),
            book: String(ip),
            fromCode: String(U.code),
            fromName: student?.name || U.name || "دانش‌آموز",
            text,
            createdAt: Date.now()
        });
    }

    saveState();
    alert(existing ? "معرفی کتاب با موفقیت ویرایش شد." : "معرفی کتاب برای دیگر دانش‌آموزان ثبت شد.");
    render();
}

function deleteBookRecommendation(id) {
    if (U.role !== "student") return;

    S.recs = (S.recs || []).filter(item =>

    if (!reservation) return;

    if (student) {
        student.pts = (student.pts || 0) + 1;

                                </button>
                                <button class="btn btn-sm btn-outline-danger"
                                        onclick="deleteStudent('${escapeHTML(student.code)}')">
                                    <i class="bi bi-trash"></i>
                                    حذف
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>

            ${!S.students.length
                ? `<div class="empty-state">دانش‌آموزی ثبت نشده است.</div>`
                : ""}
        </div>
    `;
}

function generateStudentCode() {
    let code;

    do {
        code = String(
            Math.floor(1000 + Math.random() * 9000)
        );
    } while (findStudent(code));

    return code;
}

function addStudent() {
    const name = $("#newStudentName")?.value.trim();
    const grade = $("#newStudentGrade")?.value;

    if (!name) {
        alert("نام دانش‌آموز را وارد کنید.");
        return;
    }

    S.students.push({
        code: generateStudentCode(),
        name,
        grade,
        password: "",
        pts: 0
    });

    saveState();
    render();
}

function changeStudentPassword(code) {
    if (U?.role !== "admin") return;

    const student = findStudent(code);
    if (!student) return;

    const password = prompt(
        `رمز جدید برای «${student.name}» را وارد کنید:`,
        student.password || student.code
    );
    if (password === null) return;

    const newPassword = password.trim();
    if (!newPassword) {
        alert("رمز عبور نمی‌تواند خالی باشد.");
        return;
    }

    student.password = newPassword;
    saveState();
    alert(`رمز عبور «${student.name}» با موفقیت تغییر کرد.`);
    render();
}

function deleteStudent(code) {
    if (!confirm("این دانش‌آموز حذف شود؟")) return;

    S.students = S.students.filter(student => student.code !== code);
    saveState();
    render();
}

function settingsView() {
    return `
        <div class="page-title">تنظیمات</div>
        <div class="page-description">
            تنظیم مدت امانت، رمز مدیر و پشتیبان اطلاعات
        </div>

        <div class="card-modern p-4 mb-3">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold">
                        مدت امانت (روز)
                    </label>

                    <input id="loanDays"
                           type="number"
                           min="1"
                           class="form-control"
                           value="${S.days}">
                </div>

                <div class="col-md-auto">
                    <button class="btn btn-primary"
                            onclick="saveLoanDays()">
                        ذخیره
                    </button>
                </div>
            </div>

            <hr>

            <div class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label fw-bold">
                        رمز مدیر
                    </label>

                    <input id="adminPassword"
                           class="form-control"
                           value="${escapeHTML(S.pw)}">
                </div>

                <div class="col-md-auto">
                    <button class="btn btn-primary"
                            onclick="saveAdminPassword()">
                        تغییر رمز
                    </button>
                </div>
            </div>
        </div>

        <div class="card-modern p-4">
            <h2 class="h6 fw-bold">پشتیبان‌گیری</h2>

            <p class="small text-secondary">
                اطلاعات این سامانه در پایگاه مشترک ذخیره می‌شود و از همه دستگاه‌ها قابل دسترسی است.
                برای اطمینان بیشتر می‌توانید از اطلاعات پشتیبان نیز تهیه کنید.
            </p>

            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-primary"
                        onclick="downloadBackup()">
                    <i class="bi bi-download"></i>
                    دریافت پشتیبان
                </button>

                <input id="backupFile"
                       type="file"
                       accept=".json"
                       class="form-control"
                       style="max-width:320px">

                <button class="btn btn-outline-secondary"
                        onclick="restoreBackup()">
                    بازیابی پشتیبان
                </button>
            </div>
        </div>
    `;
}

function saveLoanDays() {
    S.days = Math.max(
        1,
        Number($("#loanDays")?.value) || 7
    );

    saveState();
    alert("مدت امانت ذخیره شد.");
}

function saveAdminPassword() {
    const password = $("#adminPassword")?.value;

    if (!password) return;

    S.pw = password;
    saveState();
    alert("رمز مدیر تغییر کرد.");
}

function downloadBackup() {
    const blob = new Blob(
        [JSON.stringify(S, null, 2)],
        { type: "application/json;charset=utf-8" }
    );

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "school-library-backup.json";
    link.click();

    URL.revokeObjectURL(link.href);
}

function restoreBackup() {
    const file = $("#backupFile")?.files?.[0];

    if (!file) {
        alert("فایل پشتیبان را انتخاب کنید.");
        return;
    }

    const reader = new FileReader();

    reader.onload = event => {
        try {
            const data = JSON.parse(event.target.result);

            if (!data.cats || !data.books) {
                throw new Error("Invalid backup");
            }

            if (!confirm("اطلاعات فعلی با پشتیبان جایگزین شود؟")) {
                return;
            }

            S = data;
            saveState();
            alert("پشتیبان با موفقیت بازیابی شد.");
            render();
        } catch {
            alert("فایل پشتیبان معتبر نیست.");
        }
    };

    reader.readAsText(file);
}


initializeApp();
</script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
