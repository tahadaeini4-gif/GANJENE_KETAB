const API_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
let CLOUD_READY = false;
let CLOUD_SAVING = false;

let S = createDefaultState();
let U = null;
let V = { v: "login" };
let HISTORY = [];
let ROLE = "";
let SEARCH = "";

function normalizeState(data) {
    const base = createDefaultState();
    const state = (data && typeof data === "object") ? data : base;

    if (!Array.isArray(state.cats)) state.cats = base.cats;
    if (!Array.isArray(state.students)) state.students = [];
    if (!Array.isArray(state.books)) state.books = [];
    if (!Array.isArray(state.res)) state.res = [];
    if (!state.over || typeof state.over !== "object") state.over = {};
    if (!Array.isArray(state.recs)) state.recs = [];
    if (!Array.isArray(state.model)) state.model = [];
    if (!Number(state.days)) state.days = 7;
    if (!state.pw) state.pw = "admin123";

    state.students.forEach(student => {
        if (!student.password) student.password = String(student.code || "");
    });

    return state;
}

async function loadState() {
    if (!API_URL || API_URL.includes("PASTE_YOUR_")) {
        CLOUD_READY = false;
        return normalizeState(createDefaultState());
    }

    try {
        const response = await fetch(API_URL + "?t=" + Date.now(), {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) throw new Error("خطا در ارتباط با سرور");

        const result = await response.json();
        CLOUD_READY = true;
        return normalizeState(result.state || createDefaultState());
    } catch (error) {
        CLOUD_READY = false;
        console.error("Cloud load error:", error);
        return normalizeState(createDefaultState());
    }
}

async function saveState() {
    if (!API_URL || API_URL.includes("PASTE_YOUR_")) {
        alert("ابتدا آدرس Google Apps Script را در API_URL قرار دهید.");
        return false;
    }

    try {
        CLOUD_SAVING = true;

        const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(normalizeState(S))
        });

        if (!response.ok) throw new Error("خطا در ذخیره اطلاعات");

        const result = await response.json();
        if (!result.ok) throw new Error(result.error || "خطا در ذخیره اطلاعات");

        CLOUD_READY = true;
        return true;
    } catch (error) {
        CLOUD_READY = false;
        console.error("Cloud save error:", error);
        console.error("ذخیره اطلاعات انجام نشد:", error);
        return false;
    } finally {
        CLOUD_SAVING = false;
    }
}

async function initializeApp() {
    S = normalizeState(createDefaultState());
    render();

    if (!API_URL || API_URL.includes("PASTE_YOUR_")) return;

    setTimeout(async () => {
        try {
            const cloudState = await loadState();
            S = cloudState;
            render();
        } catch (error) {
            console.error("Background cloud load error:", error);
        }
    }, 50);
}


const $ = selector => document.querySelector(selector);

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[char]));
}

function dateFa(value) {
    if (!value) return "-";
    return new Date(value).toLocaleDateString("fa-IR");
}

function hashString(value) {
    let hash = 7;
    for (const char of String(value)) {
        hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
    }
    return hash;
}

function findStudent(code) {

        .replace(/\u200c/g, " ")

function categoryById(id) {
    for (const category of S.cats) {
        if (category.id === id) return category;

        for (const sub of category.subs || []) {
            if (sub.id === id) return sub;
        }
    }

    return null;
}

function booksByCategory(id) {
    const category = categoryById(id);
    if (!category) return [];

    if (category.grade) {
        return S.books.filter(book => book.grade === category.grade);
    }

    return S.books.filter(book => book.subject === category.name);
}

function ensureCategory(subject) {
    const cleanSubject = normalizeHeader(subject);
    if (!cleanSubject) return;

    const exists = S.cats.some(
        category => normalizeHeader(category.name) === cleanSubject
    );

    if (!exists) {
        S.cats.push({
            id: createId("cat"),
            name: cleanSubject
        });
    }
}

function renameCategory(id) {
    const category = categoryById(id);
    if (!category) return;

    const oldName = category.name;
    const newName = prompt("نام جدید دسته‌بندی:", oldName);

    if (!newName || !newName.trim()) return;

    category.name = newName.trim();

    if (!category.subs && !category.grade) {
        S.books.forEach(book => {
            if (book.subject === oldName) {
                book.subject = category.name;
            }
        });
    }

    saveState();
    render();
}

function deleteCategory(id) {
    const category = categoryById(id);
    if (!category) return;

    if (!confirm(`دسته «${category.name}» حذف شود؟ کتاب‌ها حذف نخواهند شد.`)) {
        return;
    }

    S.cats = S.cats.filter(item => item.id !== id);
    saveState();
    render();
}

function addCategory() {
    const name = prompt("نام دسته‌بندی جدید:");

    if (!name?.trim()) return;

    ensureCategory(name);
    saveState();
    render();
}


function createCover(title, hue, variation) {
    const safeTitle = String(title).slice(0, 42);

    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">
            <rect width="300" height="400" fill="hsl(${hue},60%,45%)"/>
            <rect x="20" y="20" width="260" height="360"
                  fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>
            <circle cx="150" cy="130"
                    r="${50 + variation * 15}"
                    fill="hsl(${hue + 40},70%,70%)"
                    opacity=".8"/>
            <text x="150" y="260" font-size="22"
                  fill="#fff" text-anchor="middle"
                  font-family="Tahoma">
                ${escapeHTML(safeTitle.slice(0, 20))}
            </text>
            <text x="150" y="295" font-size="16"
                  fill="#fff" text-anchor="middle"
                  font-family="Tahoma">
                ${escapeHTML(safeTitle.slice(20))}
            </text>
        </svg>
    `;

    return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

function bookImages(book) {
    const hue = hashString(`${book.ip}${book.name}`) % 360;

    const images = [0, 1, 2].map(
        variation => createCover(bookName(book), hue + variation * 20, variation)
    );

    if (S.over[book.ip]?.img) {
        images[0] = S.over[book.ip].img;
    }

    return images;
}


function readExcel(file, callback) {
    if (!file) {
        alert("ابتدا فایل Excel را انتخاب کنید.");
        return;
    }

    if (typeof XLSX === "undefined") {
        alert("کتابخانه Excel بارگذاری نشده است.");
        return;
    }

    const reader = new FileReader();

    reader.onload = event => {
        try {
            const workbook = XLSX.read(event.target.result, {
                type: "array"
            });

            if (!workbook.SheetNames.length) {
                throw new Error("No sheet");
            }

           
            const allRows = [];

            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];

                const rows = XLSX.utils.sheet_to_json(sheet, {
                    header: 1,
                    defval: "",
                    raw: false
                });

                rows.forEach(row => {
                    if (row.some(cell => String(cell).trim() !== "")) {
                        allRows.push(row);
                    }
                });
            });

            callback(allRows);
        } catch (error) {
            console.error(error);
            alert("فایل Excel خوانده نشد.");
        }
    };

    reader.readAsArrayBuffer(file);
}

function findColumnIndexes(rows) {
    const aliases = {
        name: ["نام کتاب", "عنوان کتاب", "نام"],
        subject: ["موضوع", "دسته بندی", "دسته‌بندی", "دسته"],
        author: ["نام نویسنده", "نویسنده", "مولف", "مؤلف"],
        date: ["تاریخ انتشار", "تاریخ"],
        grade: ["پایه تحصیلی", "پایه", "مقطع"],
        ip: ["ip", "شماره کتاب", "شماره"]
    };

    let headerIndex = -1;

    for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const normalized = rows[i].map(normalizeHeader);

        if (
            normalized.some(cell => aliases.name.includes(cell)) &&
            normalized.some(cell => aliases.subject.includes(cell))
        ) {
            headerIndex = i;
            break;
        }
    }

    if (headerIndex === -1) {
        return null;
    }

    const header = rows[headerIndex].map(normalizeHeader);
    const indexes = {};

    Object.entries(aliases).forEach(([key, possibleNames]) => {
        indexes[key] = header.findIndex(
            cell => possibleNames.includes(cell.toLowerCase())
        );
    });

    return {
        headerIndex,
        indexes
    };
}

function importBooks(addToExisting = false) {
    const input = $("#booksExcel");
    const file = input?.files?.[0];

    if (!file) {
        alert("فایل Excel را انتخاب کنید.");
        return;
    }

    readExcel(file, rows => {
        const structure = findColumnIndexes(rows);

        if (!structure || structure.indexes.name === -1) {
            alert(
                "ساختار فایل شناسایی نشد.\n\n" +
                "حداقل ستون «نام کتاب» باید وجود داشته باشد."
            );
            return;
        }

        const { headerIndex, indexes } = structure;

        const importedBooks = [];
        const existingIps = new Set(
            addToExisting
                ? S.books.map(book => String(book.ip))
                : []
        );

        let nextIp = Math.max(
            0,
            ...S.books.map(book => Number(book.ip) || 0)
        );

        let addedCategories = 0;

        for (let i = headerIndex + 1; i < rows.length; i++) {
            const row = rows[i];

            const name = String(
                row[indexes.name] ?? ""
            ).trim();

            if (!name) continue;

            const subject = indexes.subject >= 0
                ? String(row[indexes.subject] ?? "").trim()
                : "";

            const author = indexes.author >= 0
                ? String(row[indexes.author] ?? "").trim()
                : "";

            const date = indexes.date >= 0
                ? String(row[indexes.date] ?? "").trim()
                : "";

            const grade = indexes.grade >= 0
                ? gradeFrom(row[indexes.grade])
                : "";

            let ip = indexes.ip >= 0
                ? String(row[indexes.ip] ?? "").trim()
                : "";

            if (!ip || existingIps.has(ip)) {
                do {
                    nextIp++;
                    ip = String(nextIp);
                } while (existingIps.has(ip));
            }

            existingIps.add(ip);

            const before = S.cats.length;
            ensureCategory(subject);
            if (S.cats.length > before) {
                addedCategories++;
            }

            importedBooks.push({
                ip,
                name,
                subject,
                author,
                date,
                grade
            });
        }

        if (!importedBooks.length) {
            alert("هیچ کتابی در فایل پیدا نشد.");
            return;
        }

        S.books = addToExisting
            ? [...S.books, ...importedBooks]
            : importedBooks;

        saveState();

        alert(
            `${importedBooks.length} کتاب ثبت شد.` +
            (addedCategories
                ? `\n${addedCategories} دسته‌بندی جدید نیز از Excel ساخته شد.`
                : "")
        );

        input.value = "";
        render();
    });
}

function editBookName(ip) {
    const value = $("#editBookName")?.value.trim();

    if (!value) return;

    S.over[ip] = S.over[ip] || {};
    S.over[ip].name = value;

    saveState();
    render();
}

function editBookImage(ip) {
    const file = $("#editBookImage")?.files?.[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = event => {
        const image = new Image();

        image.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = 300;
            canvas.height = 400;

            canvas.getContext("2d")
                .drawImage(image, 0, 0, 300, 400);

            S.over[ip] = S.over[ip] || {};
            S.over[ip].img = canvas.toDataURL("image/jpeg", .7);

            saveState();
            render();
        };

        image.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

function resetBookOverride(ip) {
    delete S.over[ip];
    saveState();
    render();
}

function deleteBook(ip) {
    if (!confirm("این کتاب حذف شود؟")) return;

    S.books = S.books.filter(book => String(book.ip) !== String(ip));
    saveState();
    navigateRoot("home");
}

function saveBookRecommendation(ip) {
    if (U.role !== "student") return;

    const book = findBook(ip);
    const text = $("#bookRecommendationText")?.value.trim();

    if (!book) {
        alert("کتاب پیدا نشد.");
        return;
    }

    if (!text) {
        alert("لطفاً متن معرفی کتاب را بنویسید.");
        return;
    }

    if (!Array.isArray(S.recs)) S.recs = [];

    const existing = S.recs.find(item =>
        String(item.book) === String(ip) &&
        String(item.fromCode) === String(U.code)
    );

    const student = findStudent(U.code);

    if (existing) {
        existing.text = text;
        existing.fromName = student?.name || U.name || "دانش‌آموز";
        existing.updatedAt = Date.now();
    } else {
        S.recs.push({
            id: createId("rec"),
            book: String(ip),
            fromCode: String(U.code),
            fromName: student?.name || U.name || "دانش‌آموز",
            text,
            createdAt: Date.now()
        });
    }

    saveState();
    alert(existing ? "معرفی کتاب با موفقیت ویرایش شد." : "معرفی کتاب برای دیگر دانش‌آموزان ثبت شد.");
    render();
}

function deleteBookRecommendation(id) {
    if (U.role !== "student") return;

    if (!confirm("معرفی این کتاب حذف شود؟")) return;

    S.recs = (S.recs || []).filter(item =>
        !(String(item.id) === String(id) &&
          String(item.fromCode) === String(U.code))
    );

    saveState();
    render();
}

    const book = findBook(ip);
    if (!book) return;

    S.res.push({

        book: ip,
        name: bookName(book),

        at: Date.now(),
        due: Date.now() + S.days * DAY,

function deliverBook(id) {
    const reservation = S.res.find(item => item.id === id);

    if (!reservation) return;

    reservation.done = true;

    const student = findStudent(reservation.student);

    if (student) {
        student.pts = (student.pts || 0) + 1;
    }

    saveState();
    render();
}

                <div class="card-modern p-3">
                    <div class="text-secondary small">دسته‌بندی‌ها</div>
                    <div class="stat-number">${subjects.length}</div>
                </div>
            </div>

            <div class="col-6 col-lg-3">
                <div class="card-modern p-3">
                    <div class="text-secondary small">پایه‌ها</div>
                    <div class="stat-number">
                        ${new Set(S.books.map(book => book.grade).filter(Boolean)).size}
                    </div>
                </div>
            </div>
        </div>

        <div class="card-modern p-3 p-lg-4 mb-4">
            <div class="upload-zone">
                <div class="text-center mb-4">
                    <i class="bi bi-file-earmark-spreadsheet display-5 text-success"></i>

                    <h2 class="h5 fw-bold mt-3">
                        بارگذاری فایل Excel کتابخانه
                    </h2>

                    <p class="text-secondary small mb-0">
                        ستون‌های فایل شما به‌صورت خودکار شناسایی می‌شوند.
                    </p>
                </div>

                <input id="booksExcel"
                       type="file"
                       accept=".xlsx,.xls"
                       class="form-control mb-3">

                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-primary"
                            onclick="importBooks(false)">
                        <i class="bi bi-arrow-repeat"></i>
                        جایگزینی کل کتاب‌ها
                    </button>

                    <button class="btn btn-success"
                            onclick="importBooks(true)">
                        <i class="bi bi-plus-circle"></i>
                        افزودن به کتاب‌های فعلی
                    </button>
                </div>
            </div>
        </div>

        <div class="card-modern p-3 mb-4">
            <h2 class="h6 fw-bold">
                <i class="bi bi-info-circle text-primary"></i>
                ساختار خواندن Excel
            </h2>

            <p class="small text-secondary mb-2">
                فایل فعلی شما با ستون‌های
                <strong>نام کتاب، موضوع، نام نویسنده، تاریخ انتشار،
                پایه تحصیلی و IP</strong>
                قابل خواندن است.
            </p>

            <p class="small text-secondary mb-0">
                دسته‌بندی‌ها از مقدار واقعی ستون «موضوع» ساخته می‌شوند؛
                بنابراین اگر در Excel دسته‌بندی جدیدی اضافه کنید،
                نیازی به اضافه کردن دستی آن در کد نیست.
            </p>
        </div>

        <div class="card-modern p-3 table-wrap">
            <h2 class="h6 fw-bold mb-3">پیش‌نمایش کتاب‌های ثبت‌شده</h2>

            <table class="table table-hover align-middle table-modern">
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>نام کتاب</th>
                        <th>موضوع</th>
                        <th>نویسنده</th>
                        <th>تاریخ انتشار</th>
                        <th>پایه</th>
                    </tr>
                </thead>

                <tbody>
                    ${S.books.slice(0, 100).map(book => `
                        <tr>
                            <td>${escapeHTML(book.ip)}</td>
                            <td>${escapeHTML(bookName(book))}</td>
                            <td>${escapeHTML(book.subject || "-")}</td>
                            <td>${escapeHTML(book.author || "-")}</td>
                            <td>${escapeHTML(book.date || "-")}</td>
                            <td>${escapeHTML(book.grade || "-")}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>

            ${S.books.length > 100
                ? `<div class="small text-secondary">
                    فقط ۱۰۰ کتاب اول برای پیش‌نمایش نمایش داده شده است.
                   </div>`
                : ""}
        </div>
    `;
}


function studentsView() {
    return `
        <div class="page-title">کاربران</div>
        <div class="page-description">
            مدیریت دانش‌آموزان
        </div>

        <div class="card-modern p-3 mb-3">
            <div class="row g-2">
                <div class="col-md-5">
                    <input id="newStudentName"
                           class="form-control"
                           placeholder="نام دانش‌آموز">
                </div>

                <div class="col-md-3">
                    <select id="newStudentGrade" class="form-select">
                        ${GRADES.map(grade => `
                            <option>${grade}</option>
                        `).join("")}
                    </select>
                </div>

                <div class="col-md-auto">
                    <button class="btn btn-success"
                            onclick="addStudent()">
                        <i class="bi bi-plus-lg"></i>
                        افزودن
                    </button>
                </div>
            </div>
        </div>

        <div class="card-modern p-3 table-wrap">
            <table class="table table-hover align-middle table-modern">
                <thead>
                    <tr>
                        <th>نام</th>
                        <th>پایه</th>
                        <th>کد ورود</th>
                        <th>امتیاز</th>
                        <th>رمز</th>
                        <th>عملیات</th>
                    </tr>
                </thead>

                <tbody>
                    ${S.students.map(student => `
                        <tr>
                            <td>${escapeHTML(student.name)}</td>
                            <td>${escapeHTML(student.grade)}</td>
                            <td><strong>${escapeHTML(student.code)}</strong></td>
                            <td>${student.pts || 0}</td>
                            <td><span class="badge text-bg-light">تنظیم شده</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-1"
                                        onclick="changeStudentPassword('${escapeHTML(student.code)}')">
                                    <i class="bi bi-key"></i>
                                    تغییر رمز
                                </button>
                                <button class="btn btn-sm btn-outline-danger"
                                        onclick="deleteStudent('${escapeHTML(student.code)}')">
                                    <i class="bi bi-trash"></i>
                                    حذف
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>

            ${!S.students.length
                ? `<div class="empty-state">دانش‌آموزی ثبت نشده است.</div>`
                : ""}
        </div>
    `;
}

function generateStudentCode() {
    let code;

    do {
        code = String(
            Math.floor(1000 + Math.random() * 9000)
        );
    } while (findStudent(code));

    return code;
}

function addStudent() {
    const name = $("#newStudentName")?.value.trim();
    const grade = $("#newStudentGrade")?.value;

    if (!name) {
        alert("نام دانش‌آموز را وارد کنید.");
        return;
    }

    S.students.push({
        code: generateStudentCode(),
        name,
        grade,
        password: "",
        pts: 0
    });

    saveState();
    render();
}

function changeStudentPassword(code) {
    if (U?.role !== "admin") return;

    const student = findStudent(code);
    if (!student) return;

    const password = prompt(
        `رمز جدید برای «${student.name}» را وارد کنید:`,
        student.password || student.code
    );
    if (password === null) return;

    const newPassword = password.trim();
    if (!newPassword) {
        alert("رمز عبور نمی‌تواند خالی باشد.");
        return;
    }

    student.password = newPassword;
    saveState();
    alert(`رمز عبور «${student.name}» با موفقیت تغییر کرد.`);
    render();
}

function deleteStudent(code) {
    if (!confirm("این دانش‌آموز حذف شود؟")) return;

    S.students = S.students.filter(student => student.code !== code);
    saveState();
    render();
}

function settingsView() {
    return `
        <div class="page-title">تنظیمات</div>
        <div class="page-description">
            تنظیم مدت امانت، رمز مدیر و پشتیبان اطلاعات
        </div>

        <div class="card-modern p-4 mb-3">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold">
                        مدت امانت (روز)
                    </label>

                    <input id="loanDays"
                           type="number"
                           min="1"
                           class="form-control"
                           value="${S.days}">
                </div>

                <div class="col-md-auto">
                    <button class="btn btn-primary"
                            onclick="saveLoanDays()">
                        ذخیره
                    </button>
                </div>
            </div>

            <hr>

            <div class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label fw-bold">
                        رمز مدیر
                    </label>

                    <input id="adminPassword"
                           class="form-control"
                           value="${escapeHTML(S.pw)}">
                </div>

                <div class="col-md-auto">
                    <button class="btn btn-primary"
                            onclick="saveAdminPassword()">
                        تغییر رمز
                    </button>
                </div>
            </div>
        </div>

        <div class="card-modern p-4">
            <h2 class="h6 fw-bold">پشتیبان‌گیری</h2>

            <p class="small text-secondary">
                اطلاعات این سامانه در پایگاه مشترک ذخیره می‌شود و از همه دستگاه‌ها قابل دسترسی است.
                برای اطمینان بیشتر می‌توانید از اطلاعات پشتیبان نیز تهیه کنید.
            </p>

            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-primary"
                        onclick="downloadBackup()">
                    <i class="bi bi-download"></i>
                    دریافت پشتیبان
                </button>

                <input id="backupFile"
                       type="file"
                       accept=".json"
                       class="form-control"
                       style="max-width:320px">

                <button class="btn btn-outline-secondary"
                        onclick="restoreBackup()">
                    بازیابی پشتیبان
                </button>
            </div>
        </div>
    `;
}

function saveLoanDays() {
    S.days = Math.max(
        1,
        Number($("#loanDays")?.value) || 7
    );

    saveState();
    alert("مدت امانت ذخیره شد.");
}

function saveAdminPassword() {
    const password = $("#adminPassword")?.value;

    if (!password) return;

    S.pw = password;
    saveState();
    alert("رمز مدیر تغییر کرد.");
}

function downloadBackup() {
    const blob = new Blob(
        [JSON.stringify(S, null, 2)],
        { type: "application/json;charset=utf-8" }
    );

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "school-library-backup.json";
    link.click();

    URL.revokeObjectURL(link.href);
}

function restoreBackup() {
    const file = $("#backupFile")?.files?.[0];

    if (!file) {
        alert("فایل پشتیبان را انتخاب کنید.");
        return;
    }

    const reader = new FileReader();

    reader.onload = event => {
        try {
            const data = JSON.parse(event.target.result);

            if (!data.cats || !data.books) {
                throw new Error("Invalid backup");
            }

            if (!confirm("اطلاعات فعلی با پشتیبان جایگزین شود؟")) {
                return;
            }

            S = data;
            saveState();
            alert("پشتیبان با موفقیت بازیابی شد.");
            render();
        } catch {
            alert("فایل پشتیبان معتبر نیست.");
        }
    };

    reader.readAsText(file);
}


initializeApp();
</script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
